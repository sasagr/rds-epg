name: Generate RDS EPG

# Rebuilds rds.xml from the Tivù la Guida API on a schedule and commits it when it changes.
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch: {}       # lets you run it manually from the Actions tab
  push:
    branches: [main]
    paths: ["generate.py", ".github/workflows/epg.yml"]

permissions:
  contents: write             # allow the job to commit rds.xml back to the repo

concurrency:
  group: epg
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate rds.xml
        run: python generate.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain rds.xml)" ]; then
            git add rds.xml
            git commit -m "Update RDS EPG ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "rds.xml unchanged — nothing to commit."
          fi
